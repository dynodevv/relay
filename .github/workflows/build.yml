name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: relay-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Decode release keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ENCODED_KEYSTORE" ]; then
          echo "ERROR: SIGNING_KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        echo "$ENCODED_KEYSTORE" | base64 -d > app/release.keystore
        ls -la app/release.keystore

    - name: Build Release APK
      env:
        SIGNING_KEYSTORE_PATH: release.keystore
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Verify APK certificate
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
        echo "APK: $APK"
        unzip -p "$APK" META-INF/*.RSA META-INF/*.DSA 2>/dev/null | head -c 1 >/dev/null && \
        unzip -p "$APK" META-INF/*.RSA META-INF/*.DSA 2>/dev/null | keytool -printcert -verbose 2>/dev/null | head -20 || \
        echo "No certificate found (APK may be unsigned or debug-signed)"
        # Also print SHA-256 of cert for comparison between runs
        unzip -p "$APK" META-INF/*.RSA META-INF/*.DSA 2>/dev/null | keytool -printcert -verbose 2>/dev/null | grep -i "SHA256:" | head -1 || echo "Could not extract SHA256 fingerprint"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: relay-release-apk
        path: app/build/outputs/apk/release/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode release keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ENCODED_KEYSTORE" ]; then
          echo "ERROR: SIGNING_KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        echo "$ENCODED_KEYSTORE" | base64 -d > app/release.keystore
        ls -la app/release.keystore

    - name: Build Signed Release APK
      env:
        SIGNING_KEYSTORE_PATH: release.keystore
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Verify APK certificate
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
        echo "APK: $APK"
        unzip -p "$APK" META-INF/*.RSA META-INF/*.DSA 2>/dev/null | keytool -printcert -verbose 2>/dev/null | head -20 || echo "No certificate found"
        unzip -p "$APK" META-INF/*.RSA META-INF/*.DSA 2>/dev/null | keytool -printcert -verbose 2>/dev/null | grep -i "SHA256:" | head -1 || echo "Could not extract SHA256 fingerprint"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
